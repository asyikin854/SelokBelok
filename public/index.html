<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#33ccff" />
  <title>SelokBelok</title>
  <meta name="description" content="Navigasi komuniti untuk Malaysia — kesesakan, polis, banjir dan bahaya secara langsung." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Search -->
  <div id="search" class="card">
    <span class="search-icon">🔍</span>
    <input id="search-input" type="search" autocomplete="off" enterkeyhint="search" />
    <button id="lang-btn" class="chip" aria-label="Language">EN</button>
  </div>
  <ul id="search-results" class="card hidden"></ul>

  <!-- Live status -->
  <div id="status" class="pill"><span class="dot"></span><span id="status-text"></span></div>

  <!-- Map buttons -->
  <button id="locate-btn" class="fab small" aria-label="Locate">◎</button>
  <button id="report-btn" class="fab report" aria-label="Report">
    <span class="fab-icon">＋</span><span id="report-label"></span>
  </button>

  <!-- Route choice -->
  <section id="route-panel" class="sheet hidden">
    <div class="sheet-head">
      <div>
        <div id="dest-name" class="title"></div>
        <div id="dest-address" class="muted"></div>
      </div>
      <button id="route-close" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <ul id="route-list"></ul>
    <div class="row">
      <button id="simulate-btn" class="btn ghost"></button>
      <button id="go-btn" class="btn primary"></button>
    </div>
  </section>

  <!-- Navigation -->
  <section id="nav-banner" class="hidden">
    <div id="nav-arrow">⬆</div>
    <div>
      <div id="nav-dist" class="nav-dist"></div>
      <div id="nav-text" class="nav-text"></div>
    </div>
  </section>
  <div id="nav-alert" class="hidden"></div>
  <section id="nav-footer" class="sheet hidden">
    <div class="nav-stats">
      <div><div id="nav-eta" class="title"></div><div class="muted" id="nav-eta-label"></div></div>
      <div><div id="nav-remaining-time" class="title"></div><div class="muted">⏱</div></div>
      <div><div id="nav-remaining-dist" class="title"></div><div class="muted">↔</div></div>
    </div>
    <button id="stop-btn" class="btn danger"></button>
  </section>

  <!-- Report sheet -->
  <section id="report-sheet" class="sheet hidden">
    <div class="sheet-head">
      <div>
        <div id="report-title" class="title"></div>
        <div id="report-where" class="muted"></div>
      </div>
      <button id="report-close" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="report-types" class="grid"></div>
    <div id="report-subtypes" class="chips hidden"></div>
    <input id="report-note" class="hidden" maxlength="140" />
    <button id="report-send" class="btn primary hidden"></button>
  </section>

  <div id="toast" class="hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
