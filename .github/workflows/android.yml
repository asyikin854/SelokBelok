name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest ships with the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - run: npm ci
      - run: npm test
      # Set the repository variable API_URL to your deployed server so reports
      # are shared; without it the app keeps reports on each phone.
      - run: npm run build:app
        env:
          API_URL: ${{ vars.API_URL }}
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: selokbelok-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
